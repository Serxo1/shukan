<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title></title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #171717;
      }
      #error-display {
        display: none;
        background: #0a0a0a;
        color: #ef4444;
        padding: 20px;
        font-family: monospace;
        height: 100vh;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="error-display"></div>
    <script>
      // Global error handler for catching JS errors before React loads
      window.onerror = function(msg, url, line, col, error) {
        var errorDiv = document.getElementById('error-display');
        var root = document.getElementById('root');
        if (errorDiv && root) {
          root.style.display = 'none';
          errorDiv.style.display = 'block';
          errorDiv.innerHTML = '<h2>Erro ao carregar</h2>' +
            '<p style="color:#999">Pressione F12 para DevTools</p>' +
            '<pre style="background:#1a1a1a;padding:15px;border-radius:8px;font-size:12px">' +
            msg + '\n' + url + ':' + line + ':' + col + '\n\n' +
            (error && error.stack ? error.stack : '') +
            '</pre>' +
            '<button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer">Recarregar</button>';
        }
        return false;
      };
      window.onunhandledrejection = function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
