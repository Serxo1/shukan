name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        # Adicione quando quiser suportar:
        # platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Habit Tracker ${{ github.ref_name }}'
          releaseBody: |
            ## O que há de novo

            Veja o [changelog completo](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) para detalhes.

            ## Download

            - **Windows**: Baixe o arquivo `.exe` (instalador NSIS) ou `.msi`

            ## Instalação

            1. Baixe o instalador adequado ao seu sistema
            2. Execute e siga as instruções
            3. Use `Win+Shift+H` para abrir o orbe
          releaseDraft: true
          prerelease: false
